spring.application.name=tickershow

# ============================================================
# MySQL DataSource
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ticketshow?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP - default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / Hibernate
# ============================================================
# create       : Xóa & tạo lại toàn bộ schema mỗi lần khởi động (dùng khi dev/test)
# update       : Tự cập nhật schema theo entity thay đổi (dùng khi dev)
# validate     : Chỉ validate schema, không sửa (dùng khi staging/prod)
# none         : Không làm gì (dùng khi prod với Liquibase/Flyway)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Naming strategy: chuyển camelCase Java → snake_case DB
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Tắt open-in-view để tránh LazyInitializationException không kiểm soát
spring.jpa.open-in-view=false

# ============================================================
# Logging
# ============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.waterpark.tickershow=DEBUG

# ============================================================
# Server
# ============================================================
server.port=9090
server.servlet.context-path=/api

# ============================================================
# Jackson (JSON serialization)
# ============================================================
# spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
# spring.jackson.time-zone=Asia/Ho_Chi_Minh
# spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ============================================================
# JWT
# ============================================================
app.jwt.secret=WaterParkShowManagementSecretKeyForJWT2026MustBe256Bits!
app.jwt.expiration=86400000
